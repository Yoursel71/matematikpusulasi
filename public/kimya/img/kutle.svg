<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial, Helvetica, sans-serif">
  <!-- Ölçek: 2,5 piksel = 1 gram. İki sütunun toplamı da 80,04 g (200 piksel). -->
  <line x1="80" y1="260" x2="520" y2="260" stroke="#0b2433" stroke-width="2"/>

  <!-- Reaktifler -->
  <rect x="100" y="220" width="160" height="40" fill="#0e7c7b"/>
  <rect x="100" y="60" width="160" height="160" fill="#e4572e"/>
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="180" y="245">CH<tspan baseline-shift="sub" font-size="11">4</tspan> · 16,04 g</text>
    <text x="180" y="145" font-size="17">2 O<tspan baseline-shift="sub" font-size="12">2</tspan> · 64,00 g</text>
  </g>

  <!-- Ürünler -->
  <rect x="340" y="150" width="160" height="110" fill="#0b2433"/>
  <rect x="340" y="60" width="160" height="90" fill="#2ec4b6"/>
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="420" y="214" font-size="17">CO<tspan baseline-shift="sub" font-size="12">2</tspan> · 44,01 g</text>
    <text x="420" y="105" font-size="17">2 H<tspan baseline-shift="sub" font-size="12">2</tspan>O · 36,03 g</text>
  </g>

  <!-- Toplamlar ve bağlantı -->
  <line x1="260" y1="60" x2="340" y2="60" stroke="#5b6b73" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="17" font-weight="bold" fill="#0b2433" text-anchor="middle">
    <text x="180" y="46">Toplam 80,04 g</text>
    <text x="420" y="46">Toplam 80,04 g</text>
  </g>
  <text x="300" y="170" text-anchor="middle" font-size="28" fill="#5b6b73">=</text>

  <g font-size="16" font-weight="bold" fill="#0b2433" text-anchor="middle">
    <text x="180" y="287">Reaktifler</text>
    <text x="420" y="287">Ürünler</text>
  </g>
</svg>
