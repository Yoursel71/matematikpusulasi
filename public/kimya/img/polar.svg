<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Arial, Helvetica, sans-serif">
  <!-- Kısmi yük bulutları -->
  <circle cx="200" cy="170" r="56" fill="rgba(228,87,46,0.16)"/>
  <circle cx="121" cy="109" r="44" fill="rgba(14,124,123,0.16)"/>
  <circle cx="279" cy="109" r="44" fill="rgba(14,124,123,0.16)"/>

  <!-- Bağlar -->
  <g stroke="#0b2433" stroke-width="6">
    <line x1="200" y1="170" x2="121" y2="109"/>
    <line x1="200" y1="170" x2="279" y2="109"/>
  </g>

  <!-- Dipol momenti oku (δ+ → δ−) -->
  <line x1="200" y1="36" x2="200" y2="128" stroke="#0b2433" stroke-width="3"/>
  <polygon points="192,124 208,124 200,140" fill="#0b2433"/>
  <text x="212" y="52" font-size="16" font-weight="bold" fill="#0b2433">Net dipol</text>

  <circle cx="200" cy="170" r="30" fill="#e4572e"/>
  <text x="200" y="179" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">O</text>
  <g fill="#ffffff" stroke="#0b2433" stroke-width="1.5">
    <circle cx="121" cy="109" r="18"/>
    <circle cx="279" cy="109" r="18"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#0b2433" text-anchor="middle">
    <text x="121" y="116">H</text>
    <text x="279" y="116">H</text>
  </g>

  <!-- Kısmi yükler -->
  <g font-size="26" font-weight="bold" text-anchor="middle">
    <text x="121" y="72" fill="#0e7c7b">δ+</text>
    <text x="279" y="72" fill="#0e7c7b">δ+</text>
    <text x="200" y="256" fill="#e4572e">δ−</text>
  </g>
</svg>
