<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" font-family="Arial, Helvetica, sans-serif">
  <!-- 1. Bağlar kırılır -->
  <rect x="20" y="20" width="180" height="170" rx="10" fill="#fde7df" stroke="#e4572e" stroke-width="2"/>
  <text x="110" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#e4572e">1. BAĞLAR KIRILIR</text>
  <text x="110" y="78" text-anchor="middle" font-size="12" fill="#0b2433">4 × C–H = 4 × 413 = 1652</text>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#0b2433">2 × O=O = 2 × 498 = 996</text>
  <text x="110" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b2433">Toplam: +2648 kJ</text>
  <text x="110" y="162" text-anchor="middle" font-size="12" font-style="italic" fill="#5b6b73">enerji gerektirir</text>

  <!-- 2. Yeni bağlar kurulur -->
  <rect x="230" y="20" width="180" height="170" rx="10" fill="#d7efec" stroke="#0e7c7b" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7c7b">2. BAĞLAR KURULUR</text>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#0b2433">2 × C=O = 2 × 799 = 1598</text>
  <text x="320" y="100" text-anchor="middle" font-size="12" fill="#0b2433">4 × O–H = 4 × 463 = 1852</text>
  <text x="320" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b2433">Toplam: −3450 kJ</text>
  <text x="320" y="162" text-anchor="middle" font-size="12" font-style="italic" fill="#5b6b73">enerji açığa çıkarır</text>

  <!-- 3. Net değişim -->
  <rect x="440" y="20" width="180" height="170" rx="10" fill="#fff3c4" stroke="#ffc857" stroke-width="2.5"/>
  <text x="530" y="48" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b2433">3. NET DEĞİŞİM</text>
  <text x="530" y="86" text-anchor="middle" font-size="14" fill="#0b2433">2648 − 3450</text>
  <text x="530" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b2433">= −802 kJ</text>
  <text x="530" y="150" text-anchor="middle" font-size="12" font-style="italic" fill="#5b6b73">ekzotermik (enerji verir)</text>

  <!-- Oklar -->
  <line x1="200" y1="105" x2="226" y2="105" stroke="#0b2433" stroke-width="2.5"/>
  <polygon points="224,99 234,105 224,111" fill="#0b2433"/>
  <line x1="410" y1="105" x2="436" y2="105" stroke="#0b2433" stroke-width="2.5"/>
  <polygon points="434,99 444,105 434,111" fill="#0b2433"/>

  <!-- Not (denklem sayfadaki metinde verilir) -->
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#5b6b73">Ortalama bağ enerjileriyle yaklaşık hesap. Gaz hâlindeki su için standart değer ≈ −802 kJ/mol.</text>
</svg>
